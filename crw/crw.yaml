apiVersion: v1
kind: Namespace
metadata:
  name: crw
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crw
  namespace: crw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crw
  template:
    metadata:
      labels:
        app: crw
    spec:
      containers:
        - name: crw
          image: ghcr.io/us/crw
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: "50m"
              memory: "16Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: crw
  namespace: crw
spec:
  selector:
    app: crw
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: crw
  namespace: apps
spec:
  type: ExternalName
  externalName: crw.crw.svc.cluster.local
