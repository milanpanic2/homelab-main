apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://valkey.io/valkey-helm/
    chart: valkey
    targetRevision: 0.12.0
    helm:
      values: |
        service:
          type: ClusterIP
          port: 6379
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
        valkeyConfig: |
          maxmemory 100mb
          maxmemory-policy allkeys-lru
  destination:
    server: https://kubernetes.default.svc
    namespace: valkey
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
